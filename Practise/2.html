<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
      <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body>
  
<div ng-app="shopApp" ng-controller="shopCtrl">

    <h2>Fashion Store</h2>

    <input type="text"
           ng-model="searchText"
           placeholder="Search product">

    <div ng-repeat="p in products | filter:searchText">
        <h3>{{ p.name }}</h3>
        <p>Price: ₹{{ p.price }}</p>

        <button ng-click="addToCart(p)">
            Add to Cart
        </button>
    </div>

    <h3>Cart Items: {{ cart.length }}</h3>

    <ul>
        <li ng-repeat="item in cart">
            {{ item.name }} - ₹{{ item.price }}
        </li>
    </ul>

</div>

<script>
var app = angular.module("shopApp", []);

app.controller("shopCtrl", function($scope) {
    $scope.searchText = "";

    $scope.products = [
        {name: "T-Shirt", price: 499},
        {name: "Jeans", price: 999},
        {name: "Jacket", price: 1499}
    ];

    $scope.cart = [];

    $scope.addToCart = function(product) {
        $scope.cart.push(product);
    };
});
</script>

</body>

</html>
