<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <title>ng-click Example</title>
    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .counter-box { background: #f8fafc; padding: 30px; border-radius: 10px; display: inline-block; border: 2px solid #4F46E5; }
        h1 { font-size: 50px; color: #4F46E5; margin: 10px 0; }
        button { padding: 10px 20px; font-size: 18px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; background: #4F46E5; color: white; }
        .reset { background: #ef4444; }
    </style>
</head>

<!-- ng-controller lagaya -->
<body ng-controller="myCtrl">

    <div class="counter-box">
        <h2>Counter App</h2>
        
        <!-- Yahan ginti (count) dikhegi -->
        <h1>{{ count }}</h1>

        <!-- ng-click ka use karke functions call kar rahe hain -->
        <button ng-click="increment()">➕ Badhao</button>
        <button ng-click="decrement()">➖ Ghatao</button>
        <button class="reset" ng-click="reset()">🔄 Reset</button>
    </div>

    <script>
        var app = angular.module('myApp', []);
        
        app.controller('myCtrl', function($scope) {
            // Shuruat mein count 0 hai
            $scope.count = 0;

            // Badhane wala function
            $scope.increment = function() {
                $scope.count++;
            };

            // Ghatane wala function
            $scope.decrement = function() {
                $scope.count--;
            };

            // Reset karne wala function
            $scope.reset = function() {
                $scope.count = 0;
            };
        });
    </script>

</body>
</html>
