<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>Simple AngularJS Routing</title>
    <!-- AngularJS Main -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <!-- AngularJS Route Module (Yeh lazmi hai) -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .menu a { 
            padding: 10px 15px; 
            background: #007bff; 
            color: white; 
            text-decoration: none; 
            margin-right: 5px; 
            border-radius: 5px; 
        }
        .menu a:hover { background: #0056b3; }
        .content { margin-top: 20px; padding: 20px; border: 2px solid #007bff; border-radius: 5px; background: #f8f9fa; }
    </style>
</head>
<body>

<div ng-controller="mainCtrl">
    
    <!-- Menu -->
    <div class="menu">
        <!-- Dhyan dein: href mein #/ laga hai -->
        <a href="#!/home">Home</a>
        <a href="#!/about">About</a>
        <a href="#!/contact">Contact</a>
    </div>

    <!-- Jahan content load hoga -->
    <div class="content">
        <div ng-view></div> 
    </div>

</div>

<script>
    // 1. Module banaya aur 'ngRoute' inject kiya
    var app = angular.module("myApp", ["ngRoute"]);

    // 2. Routing Config Setup
    app.config(function($routeProvider) {
        $routeProvider
        .when("/home", {
            template: "<h2>Home Page 🏠</h2><p>Yeh home page ka content hai.</p>"
        })
        .when("/about", {
            template: "<h2>About Page ℹ️</h2><p>Yeh about page ka content hai.</p>"
        })
        .when("/contact", {
            template: "<h2>Contact Page 📞</h2><p>Yeh contact page ka content hai.</p>"
        })
        .otherwise({
            redirectTo: "/home" // Default page
        });
    });

    // 3. Controller (Optional)
    app.controller("mainCtrl", function($scope) {
        // Kuch kaam nahi hai yahan
    });
</script>

</body>
</html>
