<!DOCTYPE html>
<html ng-app="practiceApp">
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="postCtrl">
    <h2>Task 2: Create a Post</h2>
    
    <form ng-submit="submitPost()">
        <input type="text" ng-model="newPost.title" placeholder="Post Title" required>
        <input type="text" ng-model="newPost.body" placeholder="Post Body" required>
        <button type="submit">Submit</button>
    </form>

    <p style="color: green;" ng-if="successMsg">{{ successMsg }}</p>

    <script>
        var app = angular.module("practiceApp", []);
        app.controller("postCtrl", function($scope, $http) {
            $scope.newPost = {};
            $scope.successMsg = "";

            $scope.submitPost = function() {
                // API Call (POST)
                $http.post("https://jsonplaceholder.typicode.com/posts", $scope.newPost)
                .then(function(response) {
                    // Dummy API naya data save nahi karti, par success response deti hai
                    $scope.successMsg = "Post Created Successfully! ID: " + response.data.id;
                    $scope.newPost = {}; // Form clear karo
                });
            };
        });
    </script>
</body>
</html>
