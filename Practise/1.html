<!DOCTYPE html>
<html lang="en" ng-app="myregister" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AngularJS Registration</title>
    
<!-- AngularJS -->
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    
<!-- Bootstrap 5 & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
<style>
    body {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
    }
    .form-card {
        border-radius: 1.5rem;
        border: none;
        transition: transform 0.3s ease;
    }
    .result-card {
        border-radius: 1.5rem;
        background-color: #ffffff;
        border: 1px solid #e2e8f0;
    }
    .result-item {
        border-left: 4px solid #0d6efd;
        padding-left: 15px;
        margin-bottom: 15px;
        background: #f8f9fa;
        padding: 10px 15px;
        border-radius: 0 8px 8px 0;
    }
</style>
</head>
<body>

<div class="container min-vh-100 d-flex flex-column align-items-center justify-content-center py-5" ng-controller="registercontroller">
    
    <!-- ================= FORM CARD ================= -->
    <div class="card shadow-lg form-card mb-4" style="max-width: 650px; width: 100%;">
        <div class="card-body p-4 p-md-5">
            <h2 class="text-center fw-bold text-primary mb-2">
                <i class="bi bi-person-plus-fill me-2"></i>Registration Form
            </h2>
            <p class="text-center text-muted mb-4">Fill in your details to see them update live</p>

            <form>
                <div class="row">
                    <!-- Name -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold"><i class="bi bi-person me-1 text-secondary"></i>Full Name</label>
                        <input type="text" class="form-control form-control-lg" placeholder="John Doe" required ng-model="name">
                    </div>
                    <!-- Email -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold"><i class="bi bi-envelope me-1 text-secondary"></i>Email Address</label>
                        <input type="email" class="form-control form-control-lg" placeholder="john@example.com" required ng-model="email">
                    </div>
                </div>

                <div class="row">
                    <!-- Phone -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold"><i class="bi bi-telephone me-1 text-secondary"></i>Phone Number</label>
                        <input type="tel" class="form-control form-control-lg" placeholder="+91 98765 43210" required ng-model="phone">
                    </div>
                    <!-- Password (Note: Password ka output niche show nahi hoga security ke liye) -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold"><i class="bi bi-lock me-1 text-secondary"></i>Password</label>
                        <input type="password" class="form-control form-control-lg" placeholder="Min 6 characters" minlength="6" required ng-model="password">
                    </div>
                </div>

                <!-- Address -->
                <div class="mb-4">
                    <label class="form-label fw-semibold"><i class="bi bi-geo-alt me-1 text-secondary"></i>Full Address</label>
                    <textarea class="form-control" rows="2" placeholder="Enter your full address..." required ng-model="address"></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm">
                        Submit Form
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= LIVE RESULT CARD ================= -->
    <div class="card shadow-sm result-card" style="max-width: 650px; width: 100%;">
        <div class="card-body p-4">
            <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">
                <i class="bi bi-person-vcard text-primary me-2"></i>Registered Details (Live)
            </h5>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="result-item">
                        <small class="text-muted d-block">Name</small>
                        <strong class="text-dark">{{name || 'Not provided'}}</strong>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="result-item">
                        <small class="text-muted d-block">Email</small>
                        <strong class="text-dark">{{email || 'Not provided'}}</strong>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="result-item">
                        <small class="text-muted d-block">Phone</small>
                        <strong class="text-dark">{{phone || 'Not provided'}}</strong>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="result-item">
                        <small class="text-muted d-block">Address</small>
                        <strong class="text-dark">{{address || 'Not provided'}}</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- AngularJS Script (Same as yours) -->
<script>
    let app = angular.module("myregister", []);
    app.controller("registercontroller", function($scope) {
        $scope.name = "";
        $scope.email = "";
        $scope.phone = "";
        $scope.address = "";
    });
</script>

</body>
</html>
