<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>Level 4: PUT Request (Update)</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; background-color: #f0f8ff; }
        .form-box { background: white; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:disabled { background: #8fd6e1; cursor: not-allowed; }
        .msg { color: #0c5460; background: #d1ecf1; padding: 10px; border-radius: 4px; margin-top: 15px; font-weight: bold; border: 1px solid #bee5eb; }
    </style>
</head>
<body ng-controller="myCtrl">

    <div class="form-box">
        <h2>Edit User Profile</h2>

        <p ng-if="isLoading">Fetching user data from API...</p>

        <form ng-submit="updateUser()" name="updateForm" novalidate ng-if="!isLoading">
            
            <div class="form-group">
                <label>User ID:</label>
                <!-- ID change nahi honi chahiye, isliye readonly kar diya -->
                <input type="text" ng-model="user.id" readonly style="background:#eee;">
            </div>

            <div class="form-group">
                <label>Name:</label>
                <input type="text" ng-model="user.name" required>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" ng-model="user.email" required>
            </div>

            <button type="submit" ng-disabled="updateForm.$invalid || isUpdating">
                {{ isUpdating ? 'Updating...' : 'Update User' }}
            </button>
        </form>

        <!-- Success Message -->
        <div class="msg" ng-if="successMsg">
            {{ successMsg }}
        </div>
    </div>

    <script>
        var app = angular.module("myApp", []);

        app.controller("myCtrl", function($scope, $http) {
            
            $scope.user = {};
            $scope.isLoading = true;
            $scope.isUpdating = false;
            $scope.successMsg = "";

            // ✅ 1. Page load hote hi User ID 1 ka data fetch karo
            $http.get("https://jsonplaceholder.typicode.com/users/1")
            .then(function(response) {
                $scope.user = response.data; // Data form mein bhar gaya
                $scope.isLoading = false;
            });

            // ✅ 2. Update Button dabane par PUT Request
            $scope.updateUser = function() {
                $scope.isUpdating = true;
                $scope.successMsg = "";

                // PUT Request (URL ke aakhir mein /1 lagaya hai kyunki ID 1 update karni hai)
                $http.put("https://jsonplaceholder.typicode.com/users/1", $scope.user)
                .then(function(response) {
                    $scope.isUpdating = false;
                    $scope.successMsg = "✅ User updated successfully! (Name: " + response.data.name + ")";
                })
                .catch(function(error) {
                    $scope.isUpdating = false;
                    alert("Error: Update nahi ho paya.");
                });
            };

        });
    </script>
</body>
</html>
