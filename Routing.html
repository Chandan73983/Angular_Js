<!DOCTYPE html>
<html ng-app="myApp">

<head>
    <title>AngularJS Routing</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: blue;
        }

        .content {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <h1>My Website</h1>

    <nav>
        <a href="#!/home">Home</a>
        <a href="#!/about">About</a>
        <a href="#!/products">Products</a>
        <a href="#!/contact">Contact</a>
    </nav>

    <div class="content" ng-view></div>

    <script>

        var app = angular.module("myApp", ["ngRoute"]);

        app.config(function($routeProvider) {

            $routeProvider

            .when("/home", {
                template: "<h2>Home Page</h2><p>Welcome to my website!</p>"
            })

            .when("/about", {
                template: "<h2>About Us</h2><p>We are learning AngularJS.</p>"
            })

            .when("/products", {
                template: "<h2>Products</h2><p>Here are our products.</p>"
            })

            .when("/contact", {
                template: "<h2>Contact Us</h2><p>Email: example@gmail.com</p>"
            })

            .otherwise({
                redirectTo: "/home"
            });

        });

    </script>

</body>
</html>
